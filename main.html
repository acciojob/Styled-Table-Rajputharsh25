<!DOCTYPE html>
<html>
<head>
    <title>CBSE Result Sheet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
        }

        table {
            width: 60%;
            margin: 40px auto;
            border-collapse: collapse;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background-color: white;
        }

        thead {
            background-color: #1e3a8a;
            color: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            font-size: 16px;
            letter-spacing: 1px;
        }

        tbody tr:nth-child(even) {
            background-color: #f2f6ff;
        }

        tbody tr:hover {
            background-color: #dbeafe;
            transition: 0.3s;
        }

        .pass {
            color: green;
            font-weight: bold;
        }

        .fail {
            color: red;
            font-weight: bold;
        }

        caption {
            caption-side: top;
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            color: #1e3a8a;
        }
    </style>
</head>
<body>

    <table>
        <caption>CBSE Class 12 Result Sheet 2026</caption>
        <thead>
            <tr>
                <th>Subject</th>
                <th>Maximum Marks</th>
                <th>Marks Obtained</th>
                <th>Grade</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>English</td>
                <td>100</td>
                <td>92</td>
                <td>A1</td>
                <td class="pass">Pass</td>
            </tr>
            <tr>
                <td>Mathematics</td>
                <td>100</td>
                <td>85</td>
                <td>A2</td>
                <td class="pass">Pass</td>
            </tr>
            <tr>
                <td>Physics</td>
                <td>100</td>
                <td>78</td>
                <td>B1</td>
                <td class="pass">Pass</td>
            </tr>
            <tr>
                <td>Chemistry</td>
                <td>100</td>
                <td>69</td>
                <td>B2</td>
                <td class="pass">Pass</td>
            </tr>
            <tr>
                <td>Computer Science</td>
                <td>100</td>
                <td>95</td>
                <td>A1</td>
                <td class="pass">Pass</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
